{% extends "central/base.html" %}
{% block title %}Tabela de Preços - Central{% endblock %}
{% block central_content %}
<div class="space-y-5"><h1 class="page-title">Tabela de preços</h1>
<form method="get"><select name="farmacia_id" onchange="this.form.submit()" class="select">{% for f in farmacias %}<option value="{{ f.id }}" {% if farmacia and f.id == farmacia.id %}selected{% endif %}>{{ f.razao_social }}</option>{% endfor %}</select></form>
{% if farmacia %}<form method="post" class="card grid gap-3 sm:grid-cols-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="farmacia_id" value="{{ farmacia.id }}"><input name="bairro" placeholder="Bairro" class="input" required><input name="valor_taxa" placeholder="Taxa (ex.: 8,50)" class="input" required><button class="btn-primary">Adicionar</button></form>{% for b in bairros %}<div class="card grid gap-2 sm:grid-cols-[1fr_1fr_auto_auto]"><form method="post" action="{{ url_for('central.editar_preco', bairro_id=b.id) }}" class="contents"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="bairro" value="{{ b.bairro }}" class="input"><input name="valor_taxa" value="{{ '%.2f'|format(b.valor_taxa) }}" class="input"><button class="btn-primary">Salvar</button></form><form method="post" action="{{ url_for('central.excluir_preco', bairro_id=b.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="button" data-confirm-action="{{ url_for('central.excluir_preco', bairro_id=b.id) }}" data-confirm-message="Excluir este bairro da tabela de preços?" class="btn-danger">Excluir</button></form></div>{% endfor %}{% endif %}</div>
{% endblock %}
