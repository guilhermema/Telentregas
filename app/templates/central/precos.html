{% extends "central/base.html" %}
{% block title %}Tabela de Preços - Central{% endblock %}
{% block central_content %}
<div class="space-y-5"><h1 class="text-2xl font-bold">Tabela de preços</h1>
<form method="get"><select name="farmacia_id" onchange="this.form.submit()" class="w-full rounded-lg border bg-white px-3 py-2">{% for f in farmacias %}<option value="{{ f.id }}" {% if farmacia and f.id == farmacia.id %}selected{% endif %}>{{ f.razao_social }}</option>{% endfor %}</select></form>
{% if farmacia %}<form method="post" class="grid gap-3 rounded-xl bg-white p-4 shadow-sm sm:grid-cols-3"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="farmacia_id" value="{{ farmacia.id }}"><input name="bairro" placeholder="Bairro" class="rounded border px-3 py-2" required><input name="valor_taxa" placeholder="Taxa (ex.: 8,50)" class="rounded border px-3 py-2" required><button class="rounded bg-indigo-600 px-3 py-2 font-bold text-white">Adicionar</button></form>{% for b in bairros %}<div class="grid gap-2 rounded-xl bg-white p-3 shadow-sm sm:grid-cols-[1fr_1fr_auto_auto]"><form method="post" action="{{ url_for('central.editar_preco', bairro_id=b.id) }}" class="contents"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="bairro" value="{{ b.bairro }}" class="rounded border px-2 py-2"><input name="valor_taxa" value="{{ '%.2f'|format(b.valor_taxa) }}" class="rounded border px-2 py-2"><button class="rounded bg-indigo-600 px-3 py-2 text-white">Salvar</button></form><form method="post" action="{{ url_for('central.excluir_preco', bairro_id=b.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="button" data-confirm-action="{{ url_for('central.excluir_preco', bairro_id=b.id) }}" data-confirm-message="Excluir este bairro da tabela de preços?" class="rounded bg-red-600 px-3 py-2 text-white">Excluir</button></form></div>{% endfor %}{% endif %}</div>
{% endblock %}
