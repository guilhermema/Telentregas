{% extends "central/base.html" %}
{% block title %}Clientes - Central{% endblock %}
{% block central_content %}
<div class="space-y-5"><h1 class="page-title">Clientes</h1><form class="flex gap-2"><input name="busca" value="{{ busca }}" placeholder="Buscar farmácia" class="input flex-1"><button class="btn-secondary">Buscar</button></form>{% for f in farmacias %}<a href="{{ url_for('central.cliente_detalhe', farmacia_id=f.id) }}" class="card block hover:ring-2 hover:ring-brand-400"><div class="flex justify-between"><strong>{{ f.razao_social }}</strong><span class="text-sm text-slate-600">{{ totais[f.id] }} entrega(s) no mês</span></div></a>{% endfor %}</div>
{% endblock %}
